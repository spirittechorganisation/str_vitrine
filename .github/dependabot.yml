# Dependabot – site vitrine Spirit Tech (règles de l'organisation, IN39)
# - Les PR de mise à jour visent develop, jamais main (main déploie en production).
# - Rythme mensuel, regroupé, pour limiter le bruit et les minutes de CI.
# - Montées majeures des paquets structurants ignorées : elles passent par une tâche dédiée.
# - appleboy/* ignoré : l'organisation n'autorise ces actions qu'à un SHA précis
#   (liste blanche), toute nouvelle version doit être ajoutée à la main.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      mineures:
        update-types: [minor, patch]
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react*"
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: three
        update-types: [version-update:semver-major]
      - dependency-name: framer-motion
        update-types: [version-update:semver-major]
      - dependency-name: i18next*
        update-types: [version-update:semver-major]
      - dependency-name: react-i18next
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /mail-api
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    ignore:
      - dependency-name: appleboy/*

  - package-ecosystem: docker
    directories: [/, /mail-api]
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
