# ===================================================================
# Spirit Tech Revolution – Site vitrine
# ===================================================================
# Prérequis : réseau Docker "proxy" créé par l'infra partagée
#
# Démarrage :
#   cd /opt/vitrine
#   docker compose --env-file .env up -d
#
# Images Docker Hub : spirittechorganisation/str-vitrine, spirittechorganisation/str-mail-api
# URL publique     : https://spirittechrevolution.com
# ===================================================================

services:
  vitrine:
    image: spirittechorganisation/str-vitrine:${TAG:-latest}
    container_name: str-vitrine
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true

      # www.spirittechrevolution.com
      - traefik.http.routers.vitrine.rule=Host(`www.${INFRA_DOMAIN}`)
      - traefik.http.routers.vitrine.entrypoints=websecure
      - traefik.http.routers.vitrine.tls.certresolver=letsencrypt
      - traefik.http.services.vitrine.loadbalancer.server.port=80

      # spirittechrevolution.com → redirect vers www
      - traefik.http.routers.vitrine-apex.rule=Host(`${INFRA_DOMAIN}`)
      - traefik.http.routers.vitrine-apex.entrypoints=websecure
      - traefik.http.routers.vitrine-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.vitrine-apex.service=vitrine
      - traefik.http.routers.vitrine-apex.middlewares=vitrine-www-redirect
      - traefik.http.middlewares.vitrine-www-redirect.redirectregex.regex=^https://$
      - traefik.http.middlewares.vitrine-www-redirect.redirectregex.replacement=https://www.${INFRA_DOMAIN}/$${1}
      - traefik.http.middlewares.vitrine-www-redirect.redirectregex.permanent=true

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API d'envoi du formulaire de contact ─────────────────────────
  # Servie sur https://www.${INFRA_DOMAIN}/api/*
  mail-api:
    image: spirittechorganisation/str-mail-api:${TAG:-latest}
    container_name: str-mail-api
    restart: unless-stopped
    networks:
      - proxy
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-contact@spirittechrevolution.com}
    labels:
      - traefik.enable=true
      - traefik.http.routers.vitrine-api.rule=Host(`www.${INFRA_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.vitrine-api.entrypoints=websecure
      - traefik.http.routers.vitrine-api.tls.certresolver=letsencrypt
      - traefik.http.routers.vitrine-api.priority=100
      - traefik.http.services.vitrine-api.loadbalancer.server.port=3000

networks:
  proxy:
    external: true